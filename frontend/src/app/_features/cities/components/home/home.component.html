<section class="home-page">
  <h1>Cities</h1>

  @if (loading()) {
    <otto-spinner ariaLabel="Loading cities" size="60px" />
  } @else {
    <otto-data-view
      [data]="pagedCities()"
      [columns]="columns"
      [pagination]="pagination()"
      itemLabel="cities"
      dataKey="name"
      (paginationChange)="onPaginationChange($event)"
    />
  }
</section>
